# Railway service config shared by every service in the project.
#
# Each service is created via the Railway UI pointing at this repo; this file
# provides the build + default deploy config they share.
#
# To create the services:
#   1. Railway → New Service → GitHub Repo → EvanMcCormick37/titled-tuesday-analysis (branch: mobile-production)
#   2. For each service, override the start command in the UI:
#        tt-cron → python scripts/weekly_pipeline.py
#        bb-cron → python scripts/weekly_pipeline.py --market bullet_brawl
#        tt-app  → python -m streamlit run app/dashboard.py --server.port=$PORT --server.address=0.0.0.0
#      Use `python -m streamlit` (not bare `streamlit`) — the module form is
#      PATH-independent and avoids "executable not found" errors on PaaS hosts
#      that run start commands through a stripped-down shell.
#   3. For the cron services: set the cron schedule in the UI (Settings → Cron Schedule).
#      tt-cron: 0 19 * * 2    (Tuesdays at 19:00 UTC = 15:00 EDT / 14:00 EST)
#      bb-cron: 0 20 * * 6    (Saturdays at 20:00 UTC = 16:00 EDT / 15:00 EST;
#                              the 2-hour arena starts at 12:00 ET)
#      Railway cron expressions are evaluated in UTC regardless of the TZ env
#      var — the TZ var only affects what the container's clock returns inside
#      Python (which matters for _most_recent_tuesday()). Use numeric day-of-week
#      (2 = Tuesday, 6 = Saturday), not the "TUE" alias — Railway's parser doesn't accept it.
#   4. Set the shared env vars listed below on each service (or on the project).
#
# Shared build:  all services use the Dockerfile at the repo root and
# pass GH_TOKEN as a build arg so pip can install the private kalshi-core.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# kalshi-core is installed at container start by docker-entrypoint.sh, which
# reads $GH_TOKEN (set as a regular service env var — not a build arg).

[deploy]
# Default start command — Railway cron overrides nothing here, it just invokes
# the container with this CMD on each schedule tick.
# No startCommand here: values in this file override the dashboard for every
# service using it. Each service sets its own start command in the dashboard;
# with none set, the Dockerfile CMD (the weekly pipeline) runs.
# Restart policy is also per-service: Never for tt-cron and bb-cron, On Failure for the rest.
# healthcheckPath has no meaning for a cron job; leave unset.

# ── Env vars required (set per-service in Railway UI) ────────────────────────
# Shared across all services:
#   DATABASE_URL              = ${{ Postgres.DATABASE_URL }}     # Railway internal reference
#   KALSHI_API_KEY_ID         = <from ~/.kalshi/.env>
#   KALSHI_PRIVATE_KEY_B64    = <base64 of ~/.kalshi/trading-key.txt>
#   KALSHI_ENV                = prod
#   TZ                        = America/New_York                  # so cron fires at 15:00 ET year-round
#   GH_TOKEN                  = <GitHub PAT with repo scope>      # read by entrypoint to install kalshi-core
#
# tt-app only:
#   PORT                      = (auto-provided by Railway)
#   DASHBOARD_PASSWORD        = <long random>
#
# bb-cron: shared vars only. Before its first run, copy the local Bullet Brawl
#   history to Railway with scripts/push_bullet_brawl_history.py.
#
# tt-api (React dashboard + JSON API):
#   Start command: /bin/sh -c "exec python -m uvicorn api.main:app --host 0.0.0.0 --port $PORT"
#   (Dockerfile start commands get no shell, so $PORT needs the sh -c wrapper.)
#   Healthcheck path: /api/me
#   Env: shared vars + DASHBOARD_PASSWORD. Restart policy ON_FAILURE.
#
# tt-worker (trade queue, recomputes, live Kalshi snapshots):
#   Start command: python scripts/trade_worker.py
#   Env: shared vars + RAILWAY_DEPLOYMENT_DRAINING_SECONDS=30.
#   Not a web service. Exactly one replica. Restart policy ON_FAILURE.
#   Serves every registered market (Titled Tuesday, Bullet Brawl).
